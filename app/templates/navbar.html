{% block navbar %}
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <!-- Brand Logo -->
        <a class="navbar-brand" href="/">
            <img src="{{ url_for('static', filename='check_point.png') }}" alt="Check Point" height="30">
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/ips' %}active{% endif %}" href="/ips">IPS Attacks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/av' %}active{% endif %}" href="/av">Malware Files</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/te' %}active{% endif %}" href="/te">File Generator</a>
                </li>
                
                <!-- Theme Toggle -->
                <li class="nav-item ms-lg-3">
                    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
{% endblock %}
