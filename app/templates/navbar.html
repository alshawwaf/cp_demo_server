{% block navbar %}
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <!-- Brand -->
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/" style="font-size:.95rem; color:var(--text-main);">
            <i class="bi bi-shield-shaded" style="color:var(--primary-color); font-size:1.2rem;"></i>Demo Server
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/aiff' %}active{% endif %}" href="/aiff"><i class="bi bi-cpu me-1"></i>AI Factory</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/ips' %}active{% endif %}" href="/ips">IPS Attacks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/av' %}active{% endif %}" href="/av">Malware Files</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/te' %}active{% endif %}" href="/te">File Generator</a>
                </li>
                
                <!-- Logout -->
                <li class="nav-item ms-lg-2">
                    <a href="/logout" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>

                <!-- Theme Toggle -->
                <li class="nav-item ms-lg-3">
                    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                        <i class="bi bi-sun-fill"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
{% endblock %}
