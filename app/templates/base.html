<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threat Prevention Demo Server</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
      type="image/x-icon"
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <!-- DataTables Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"
    />

    <!-- Custom Styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />

    <!-- Theme Initialization Script (Prevents Flash of Light Mode) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    {% block head %}{% endblock %}
  </head>

  <body>
    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <!-- Content -->
    <div class="container py-4" id="content">
      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    {% include 'footbar.html' %}

    <!-- Scripts -->
    <!-- jQuery (Required for DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    {% block scripts %}{% endblock %}

    <script>
      // Notification System
      function showNotification(message, type = "success") {
          const container = document.getElementById('notificationContainer');

          // Map bootstrap types to our custom types if needed, or just use them
          // success, danger, warning are standard

          const notification = document.createElement('div');
          notification.className = `notification notification-${type}`;

          // Icon selection
          let icon = 'bi-check-circle-fill';
          if (type === 'danger') icon = 'bi-exclamation-circle-fill';
          if (type === 'warning') icon = 'bi-exclamation-triangle-fill';

          notification.innerHTML = `
              <div class="d-flex align-items-center w-100">
                  <i class="bi ${icon} me-3 fs-5"></i>
                  <span class="flex-grow-1 fw-medium">${message}</span>
                  <button type="button" class="btn-close ms-2" aria-label="Close" onclick="this.closest('.notification').remove();"></button>
              </div>
          `;

          container.appendChild(notification);

          // Auto remove
          setTimeout(() => {
              if (notification.parentNode) {
                  notification.style.opacity = '0';
                  notification.style.transform = 'translateX(100%)';
                  notification.style.transition = 'all 0.3s ease';
                  setTimeout(() => notification.remove(), 300);
              }
          }, 5000);
      }

      // Flash Messages
      $(document).ready(function () {
          {% with messages = get_flashed_messages(with_categories = true) %}
          {% for category, message in messages %}
          showNotification("{{ message }}", "{{ category }}");
          {% endfor %}
          {% endwith %}
      });

      // Form Validation Helpers
      document.querySelectorAll('form').forEach(form => {
          form.addEventListener('submit', function (e) {
              // Target IP Validation
              const globalTargetIp = document.getElementById('target_ip');
              const formTargetIpField = form.querySelector('#target_ip_form');
              if (globalTargetIp && formTargetIpField) {
                  formTargetIpField.value = globalTargetIp.value;
                  if (!globalTargetIp.value) {
                      e.preventDefault();
                      showNotification('Please provide a valid target IP address.', 'danger');
                      return;
                  }
              }

              // File Type Validation
              const globalFileTypes = document.getElementById('file_types');
              const formFileTypesField = form.querySelector('#fileGenForm');
              if (globalFileTypes && formFileTypesField) {
                  formFileTypesField.value = globalFileTypes.value;
                  if (!globalFileTypes.value) {
                      e.preventDefault();
                      showNotification('Please select a file type', 'danger');
                      return;
                  }
              }
          });
      });

      // Theme Management
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      const iconElement = themeToggle ? themeToggle.querySelector('i') : null;

      function updateThemeIcon(theme) {
          if (iconElement) {
              iconElement.className = theme === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
          }
      }

      function setTheme(theme) {
          htmlElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
          updateThemeIcon(theme);
      }

      // Initialize Icon based on current theme (set in head)
      const currentTheme = htmlElement.getAttribute('data-theme');
      updateThemeIcon(currentTheme);

      if (themeToggle) {
          themeToggle.addEventListener('click', () => {
              const currentTheme = htmlElement.getAttribute('data-theme');
              const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
              setTheme(newTheme);
          });
      }
    </script>
  </body>
</html>
